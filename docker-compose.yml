services:
  app:
    build: .
    container_name: management-app
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - ./storage:/var/www/html/storage
    ports:
      - '9000:9000'
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - mysql

  nginx:
    build: ./docker/nginx
    container_name: laravel-nginx
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - app

  mysql:
    image: mysql:8
    container_name: laravel-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:
